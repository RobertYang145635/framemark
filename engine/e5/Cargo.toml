[package]
name = "fm-e5"
version = "0.1.0"
edition = "2021"
publish = false
description = "E5 bench: JPEG/PNG encode parity, EXIF write/readback, TIFF->PNG, RSS/commit sampling"

# Own workspace root, like T1c/E2a/E2b; the main engine crate is untouched.
[workspace]

[lib]
name = "fm_e5"
path = "src/lib.rs"

[[bin]]
name = "e5"
path = "src/bin/e5.rs"

[dependencies]
# Same prebuilt as T1c/E2a/E2b (d3d-ganesh-gl-jpegd-jpege-pdf-textlayout).
# `jpeg` = jpeg-decode + jpeg-encode; PNG codecs are always in Skia.
skia-safe = { version = "0.156", features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
# NOTE: a second libjpeg (mozjpeg) cannot live in this binary — it collides with
# the libjpeg-turbo that Skia statically links (`JPEG parameter struct mismatch`,
# fatal). The streaming prototype is therefore a separate crate:
# `stream-proto/` (mozjpeg only, no Skia).

[profile.release]
opt-level = 2
