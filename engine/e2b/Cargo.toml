[package]
name = "fm-e2b"
version = "0.1.0"
edition = "2021"
publish = false
description = "E2b: native IR renderer for liquid-glass + vivo styles (E2a gaps ported)"

# Own workspace root, like T1c/E2a; the T0 crate is untouched.
[workspace]

[[bin]]
name = "e2b"
path = "src/main.rs"

[dependencies]
skia-safe = { version = "0.156", features = ["textlayout", "d3d", "gl"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32",
    "Win32_Foundation",
    "Win32_Graphics",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
