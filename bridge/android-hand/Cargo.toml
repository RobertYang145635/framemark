[package]
name = "fm-android-hand"
version = "0.1.0"
edition = "2021"
publish = false
description = "X1 Android hand-template renderer: e4-hand modules reused read-only, CPU raster, C ABI"

[workspace]

[lib]
name = "fm_android_hand"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
skia-safe = { version = "0.156", features = ["textlayout", "gl"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
skia-safe = { version = "0.156", features = ["textlayout", "d3d", "gl"] }

[profile.release]
opt-level = 2
